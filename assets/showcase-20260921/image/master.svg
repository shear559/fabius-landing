  <radialGradient id="lt-fade" cx="50%" cy="50%" r="50%"><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="lt-lattice-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="2400" height="2400"><rect width="2400" height="2400" fill="url(#lt-fade)"/></mask>

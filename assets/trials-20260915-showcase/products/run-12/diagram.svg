<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="100%" height="100%" style="max-width:420px;font-family:system-ui,Helvetica,Arial,sans-serif;background:#ffffff" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Feasible polygon in (x,y) after eliminating z, with optimizer path over t in [-2,4]</title>
  <desc id="desc">Pentagon ABCDE bounded by x&gt;=0, y&gt;=0, x&lt;=3/5, x+y&lt;=1, 2y+z&gt;=1/2; the optimizer traces a path from (0,1/4) through (3/8,0) and (1/2,0) to (3/5,1/10) as t rises from -2 to 4.</desc>

  <!-- coordinate map: px = 60 + x*260 ; py = 380 - y*260 -->

  <!-- feasible polygon A(0,0) B(1/2,0) C(3/5,1/10) D(3/5,2/5) E(0,1) -->
  <polygon points="60,380 190,380 216,354 216,276 60,120"
           fill="#dbe9fb" stroke="#1f4e8c" stroke-width="2" stroke-linejoin="round"/>

  <!-- axes -->
  <line x1="60" y1="380" x2="260" y2="380" stroke="#333" stroke-width="1.2"/>
  <line x1="60" y1="380" x2="60" y2="90" stroke="#333" stroke-width="1.2"/>
  <text x="255" y="398" font-size="12" fill="#333">x</text>
  <text x="44" y="96" font-size="12" fill="#333">y</text>
  <text x="55" y="398" font-size="11" fill="#333" text-anchor="middle">0</text>

  <!-- x ticks -->
  <text x="190" y="398" font-size="11" fill="#333" text-anchor="middle">1/2</text>
  <line x1="190" y1="377" x2="190" y2="383" stroke="#333"/>
  <text x="216" y="398" font-size="11" fill="#333" text-anchor="middle">3/5</text>
  <line x1="216" y1="377" x2="216" y2="383" stroke="#333"/>

  <!-- y ticks -->
  <text x="50" y="384" font-size="11" fill="#333" text-anchor="end">0</text>
  <text x="50" y="358" font-size="11" fill="#333" text-anchor="end">1/10</text>
  <line x1="57" y1="354" x2="63" y2="354" stroke="#333"/>
  <text x="50" y="280" font-size="11" fill="#333" text-anchor="end">2/5</text>
  <line x1="57" y1="276" x2="63" y2="276" stroke="#333"/>
  <text x="50" y="124" font-size="11" fill="#333" text-anchor="end">1</text>
  <line x1="57" y1="120" x2="63" y2="120" stroke="#333"/>

  <!-- edge labels (constraint each side lies on) -->
  <text x="125" y="393" font-size="10.5" fill="#555" text-anchor="middle">edge AB: y = 0</text>
  <text x="236" y="318" font-size="10.5" fill="#555" text-anchor="middle" transform="rotate(90 236 318)">edge CD: x = 3/5</text>
  <text x="130" y="192" font-size="10.5" fill="#555" text-anchor="middle" transform="rotate(-58 130 192)">edge DE: x+y = 1 (z=0)</text>
  <text x="40" y="200" font-size="10.5" fill="#555" text-anchor="middle" transform="rotate(-90 40 200)">edge EA: x = 0</text>
  <text x="196" y="370" font-size="10" fill="#555" text-anchor="start" transform="rotate(-58 196 370)">BC: 2y+z=1/2</text>

  <!-- vertex markers + labels -->
  <circle cx="60" cy="380" r="3" fill="#1f4e8c"/>
  <text x="60" y="393" font-size="10.5" fill="#1f4e8c" text-anchor="middle" dx="-14" dy="-2">A(0,0)</text>
  <circle cx="190" cy="380" r="3" fill="#1f4e8c"/>
  <text x="190" y="393" font-size="10.5" fill="#1f4e8c" text-anchor="middle" dy="16">B(1/2,0)</text>
  <circle cx="216" cy="354" r="3" fill="#1f4e8c"/>
  <text x="222" y="352" font-size="10.5" fill="#1f4e8c">C(3/5,1/10)</text>
  <circle cx="216" cy="276" r="3" fill="#1f4e8c"/>
  <text x="222" y="274" font-size="10.5" fill="#1f4e8c">D(3/5,2/5)</text>
  <circle cx="60" cy="120" r="3" fill="#1f4e8c"/>
  <text x="66" y="116" font-size="10.5" fill="#1f4e8c">E(0,1)</text>

  <!-- optimizer path: (0,1/4) -> (3/8,0) -> (1/2,0)=B -> (3/5,1/10)=C -->
  <polyline points="60,315 157.5,380 190,380 216,354"
            fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- path breakpoint dots + t labels -->
  <circle cx="60" cy="315" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="66" y="311" font-size="10" fill="#c0392b">t=-2..-3/2: (0,1/4)</text>
  <circle cx="157.5" cy="380" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="102" y="418" font-size="10" fill="#c0392b" text-anchor="middle">t=-1: (3/8,0)</text>
  <circle cx="190" cy="380" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="190" y="432" font-size="10" fill="#c0392b" text-anchor="middle">t=-1/2..0: B</text>
  <circle cx="216" cy="354" r="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <text x="230" y="368" font-size="10" fill="#c0392b">t=9/5..4: C</text>

  <!-- legend -->
  <rect x="60" y="24" width="12" height="12" fill="#dbe9fb" stroke="#1f4e8c"/>
  <text x="78" y="34" font-size="11" fill="#333">feasible region (x,y), z=1-x-y</text>
  <line x1="60" y1="52" x2="80" y2="52" stroke="#c0392b" stroke-width="3"/>
  <text x="86" y="56" font-size="11" fill="#333">optimizer (x*(t),y*(t)), t: -2 &#8594; 4</text>
  <text x="10" y="14" font-size="11.5" fill="#111" font-weight="600">Feasible polygon &amp; optimal path, t &#8712; [-2,4]</text>
</svg>

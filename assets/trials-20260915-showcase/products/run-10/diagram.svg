<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 690" width="440" height="690" role="img"
     preserveAspectRatio="xMidYMid meet"
     aria-labelledby="dtitle ddesc" font-family="Helvetica, Arial, sans-serif">
  <title id="dtitle">Feasible region in (x,y) after eliminating z, and the optimizer path</title>
  <desc id="ddesc">
    Pentagon A(0,0) B(1/2,0) C(3/5,1/10) D(3/5,2/5) E(0,1) is the feasible set for
    (x,y) once z=1-x-y is eliminated. The optimizer (x*(t),y*(t)) sits at the fixed
    point P1=(0,1/4) for t in [-2,-3/2], crosses the interior to P2=(3/8,0), runs along
    edge AB to vertex B=(1/2,0), stays at B for t in [-1/2,0], then runs along edge BC
    to vertex C=(3/5,1/10) where it stays fixed for t in [9/5,4].
  </desc>

  <rect x="0" y="0" width="440" height="690" fill="#ffffff"/>

  <!-- Title -->
  <text x="220" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Feasible polygon and optimizer path</text>
  <text x="220" y="45" text-anchor="middle" font-size="12" fill="#444444">(x, y) plane after eliminating z = 1 - x - y</text>

  <!-- Axes -->
  <g stroke="#666666" stroke-width="1.2">
    <line x1="70" y1="508" x2="352" y2="508"/>
    <line x1="89" y1="508" x2="89" y2="90"/>
  </g>
  <!-- x ticks -->
  <g font-size="11" fill="#444444" text-anchor="middle">
    <line x1="89" y1="504" x2="89" y2="512" stroke="#666666"/>
    <text x="89" y="524">0</text>
    <line x1="165" y1="504" x2="165" y2="512" stroke="#666666"/>
    <text x="165" y="524">0.2</text>
    <line x1="241" y1="504" x2="241" y2="512" stroke="#666666"/>
    <text x="241" y="524">0.4</text>
    <line x1="317" y1="504" x2="317" y2="512" stroke="#666666"/>
    <text x="317" y="524">0.6</text>
    <text x="352" y="503" text-anchor="start" font-style="italic">x</text>
  </g>
  <!-- y ticks -->
  <g font-size="11" fill="#444444" text-anchor="end">
    <line x1="85" y1="489" x2="93" y2="489" stroke="#666666"/>
    <text x="80" y="493">0</text>
    <line x1="85" y1="394" x2="93" y2="394" stroke="#666666"/>
    <text x="80" y="398">0.25</text>
    <line x1="85" y1="299" x2="93" y2="299" stroke="#666666"/>
    <text x="80" y="303">0.5</text>
    <line x1="85" y1="109" x2="93" y2="109" stroke="#666666"/>
    <text x="80" y="113">1</text>
    <text x="89" y="80" text-anchor="middle" font-style="italic">y</text>
  </g>

  <!-- Feasible pentagon A-B-C-D-E -->
  <polygon points="89,489 279,489 317,451 317,337 89,109"
           fill="#dbe9f7" stroke="#2b6cb0" stroke-width="2" fill-opacity="0.85"/>

  <!-- Edge labels (constraint each edge sits on) -->
  <g font-size="10.5" fill="#2b6cb0" font-style="italic">
    <text x="184" y="502" text-anchor="middle">y = 0</text>
    <text x="309" y="475" text-anchor="middle" transform="rotate(-70 309 475)">y = x - 1/2</text>
    <text x="330" y="394" text-anchor="middle">x = 3/5</text>
    <text x="196" y="212" text-anchor="middle" transform="rotate(30 196 212)">x + y = 1</text>
    <text x="70" y="300" text-anchor="middle" transform="rotate(-90 70 300)">x = 0</text>
  </g>

  <!-- Optimizer path: P1 -> P2 -> B -> C -->
  <polyline points="89,394 231.5,489 279,489 317,451"
            fill="none" stroke="#c53030" stroke-width="3" stroke-linejoin="round"/>
  <!-- arrowhead near C showing increasing-t direction -->
  <polygon points="317,451 306,446 308,457" fill="#c53030"/>

  <!-- Held-fixed ranges: dashed halo around P1 and C -->
  <circle cx="89" cy="394" r="7" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="317" cy="451" r="7" fill="none" stroke="#c53030" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Vertices -->
  <g>
    <circle cx="89" cy="489" r="3.6" fill="#1a1a1a"/>
    <text x="80" y="500" text-anchor="end" font-size="11" fill="#1a1a1a">A (0, 0)</text>

    <circle cx="279" cy="489" r="4.2" fill="#c53030"/>
    <text x="279" y="504" text-anchor="middle" font-size="11" fill="#1a1a1a">B (1/2, 0)</text>

    <circle cx="317" cy="451" r="4.2" fill="#c53030"/>
    <text x="325" y="448" text-anchor="start" font-size="11" fill="#1a1a1a">C (3/5, 1/10)</text>

    <circle cx="317" cy="337" r="3.6" fill="#1a1a1a"/>
    <text x="325" y="334" text-anchor="start" font-size="11" fill="#1a1a1a">D (3/5, 2/5)</text>

    <circle cx="89" cy="109" r="3.6" fill="#1a1a1a"/>
    <text x="80" y="106" text-anchor="end" font-size="11" fill="#1a1a1a">E (0, 1)</text>

    <circle cx="89" cy="394" r="4.2" fill="#c53030"/>
    <text x="98" y="391" text-anchor="start" font-size="11" fill="#1a1a1a">P1 (0, 1/4)</text>

    <circle cx="231.5" cy="489" r="3.2" fill="#744210"/>
    <text x="231.5" y="479" text-anchor="middle" font-size="10.5" fill="#744210">P2 (3/8, 0)</text>
  </g>

  <!-- Legend / caption block, kept readable at mobile width -->
  <g font-size="11.5" fill="#222222">
    <rect x="30" y="548" width="380" height="130" rx="6" fill="#f7f7f7" stroke="#cccccc"/>
    <text x="40" y="565" font-weight="700" font-size="12.5">Optimizer path as t runs from -2 to 4 (red)</text>
    <text x="40" y="583">t ∈ [-2, -3/2]:  fixed at P1 = (0, 1/4)   — edge x=0</text>
    <text x="40" y="599">t ∈ [-3/2, -1]:  P1 → P2, straight interior segment</text>
    <text x="40" y="615">t ∈ [-1, -1/2]:  P2 → B along edge y=0</text>
    <text x="40" y="631">t ∈ [-1/2, 0]:   fixed at vertex B = (1/2, 0)</text>
    <text x="40" y="647">t ∈ [0, 9/5]:    B → C along edge y = x - 1/2</text>
    <text x="40" y="663">t ∈ [9/5, 4]:    fixed at vertex C = (3/5, 1/10)</text>
  </g>
</svg>

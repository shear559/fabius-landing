<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fieldnote Board — Reef Resilience Publication</title>
<meta name="description" content="Local-first task board for a small research-publication team." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231f6f5c' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M5 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z'/%3E%3Cpath d='M8 3v18'/%3E%3Cpath d='M11 8h4M11 12h4M11 16h3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<noscript>
  <div class="noscript-banner">
    Fieldnote Board needs JavaScript to run. Please enable JavaScript in your browser and reload this page.
  </div>
</noscript>

<!-- Icon sprite: one coherent original stroke-based family, reused via <use> -->
<svg aria-hidden="true" style="display:none">
  <defs>
    <symbol id="icon-notebook" viewBox="0 0 24 24"><path d="M5 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M8 3v18"/><path d="M11 8h4M11 12h4M11 16h3"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="M13 6.5 17.5 11"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M10 11v6M14 11v6"/></symbol>
    <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M7 7 3 11l4 4"/><path d="M3 11h11a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.35-4.35"/></symbol>
    <symbol id="icon-export" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="icon-import" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="icon-board" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v5"/><circle cx="12" cy="17.3" r="0.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M3 11.5 12 2.5h7a2 2 0 0 1 2 2v7l-9 9-9-9Z"/><circle cx="15" cy="7" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
    <symbol id="icon-sync" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="m17 4 1.5 2.7L21 5M7 20l-1.5-2.7L3 19"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="app-header">
    <div class="brand">
      <svg class="icon icon-brand" aria-hidden="true"><use href="#icon-notebook"/></svg>
      <div class="brand-text">
        <h1>Fieldnote Board</h1>
        <p class="brand-sub">Reef Resilience Publication Team &middot; local-first demo</p>
      </div>
    </div>
    <div class="view-switch" role="group" aria-label="Board layout">
      <button type="button" class="view-btn" data-view-btn="board" aria-pressed="true">
        <svg class="icon" aria-hidden="true"><use href="#icon-board"/></svg>
        <span>Board</span>
      </button>
      <button type="button" class="view-btn" data-view-btn="list" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#icon-list"/></svg>
        <span>List</span>
      </button>
    </div>
  </header>

  <div id="notices" class="notices" aria-live="polite"></div>

  <section class="toolbar" aria-label="Search, filter and manage tasks">
    <div class="search-field">
      <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
      <label class="sr-only" for="search-input">Search tasks by title, project or tag</label>
      <input id="search-input" type="search" data-testid="search" placeholder="Search title, project or tag&hellip;" autocomplete="off" />
    </div>

    <div class="filters">
      <label class="filter-label" for="filter-status">Status
        <select id="filter-status" data-testid="filter-status">
          <option value="all">All statuses</option>
          <option value="todo">To do</option>
          <option value="doing">Doing</option>
          <option value="done">Done</option>
        </select>
      </label>
      <label class="filter-label" for="filter-project">Project
        <select id="filter-project" data-testid="filter-project">
          <option value="all">All projects</option>
        </select>
      </label>
      <label class="filter-label" for="filter-priority">Priority
        <select id="filter-priority" data-testid="filter-priority">
          <option value="all">All priorities</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>
    </div>

    <div class="toolbar-actions">
      <button type="button" class="btn btn-ghost" data-testid="export" aria-label="Export full board as JSON">
        <svg class="icon" aria-hidden="true"><use href="#icon-export"/></svg>
        <span>Export</span>
      </button>
      <label class="btn btn-ghost file-btn" for="import-input">
        <svg class="icon" aria-hidden="true"><use href="#icon-import"/></svg>
        <span>Import</span>
      </label>
      <input id="import-input" type="file" accept="application/json,.json" data-testid="import-file" class="sr-only-input" />
      <button type="button" class="btn btn-primary" data-testid="create-task" id="create-task-btn">
        <svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg>
        <span>New task</span>
      </button>
    </div>
  </section>

  <p id="task-count" class="task-count" role="status"></p>
  <p id="import-error" class="import-error" role="alert" hidden></p>

  <main id="board-region">
    <div id="empty-state" class="empty-state" hidden>
      <svg class="icon icon-large" aria-hidden="true"><use href="#icon-notebook"/></svg>
      <h2>No tasks yet</h2>
      <p>Start the board by adding the first task for the publication team.</p>
      <button type="button" class="btn btn-primary" data-testid="create-task-empty">
        <svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg>
        <span>New task</span>
      </button>
    </div>

    <div id="no-results-state" class="empty-state" hidden>
      <svg class="icon icon-large" aria-hidden="true"><use href="#icon-search"/></svg>
      <h2>No matching tasks</h2>
      <p>Try a different search term or clear a filter.</p>
      <button type="button" class="btn btn-ghost" id="clear-filters-btn">Clear search &amp; filters</button>
    </div>

    <div id="board-view" class="board-view"></div>
    <div id="list-view" class="list-view" hidden></div>
  </main>
</div>

<div id="undo-toast" class="toast" hidden role="status">
  <span id="undo-toast-text"></span>
  <button type="button" data-testid="undo-delete" class="btn btn-ghost btn-small">
    <svg class="icon" aria-hidden="true"><use href="#icon-undo"/></svg>
    <span>Undo</span>
  </button>
</div>

<dialog id="task-dialog" class="task-dialog" aria-labelledby="task-dialog-title">
  <form data-testid="task-form" id="task-form" novalidate>
    <div class="dialog-head">
      <h2 id="task-dialog-title">New task</h2>
      <button type="button" class="icon-btn" id="dialog-close" aria-label="Close form">
        <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
      </button>
    </div>

    <div class="field">
      <label for="field-title">Title</label>
      <input id="field-title" name="title" type="text" maxlength="200" required />
      <p class="field-error" data-error-for="title" hidden></p>
    </div>

    <div class="field">
      <label for="field-project">Project</label>
      <input id="field-project" name="project" type="text" maxlength="160" required />
      <p class="field-error" data-error-for="project" hidden></p>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="field-status">Status</label>
        <select id="field-status" name="status">
          <option value="todo">To do</option>
          <option value="doing">Doing</option>
          <option value="done">Done</option>
        </select>
      </div>
      <div class="field">
        <label for="field-priority">Priority</label>
        <select id="field-priority" name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="field-dueDate">Due date</label>
      <input id="field-dueDate" name="dueDate" type="date" />
      <p class="field-error" data-error-for="dueDate" hidden></p>
    </div>

    <div class="field">
      <label for="field-tags">Tags <span class="field-hint">comma-separated, up to 8</span></label>
      <input id="field-tags" name="tags" type="text" placeholder="fieldwork, writing" />
      <p class="field-error" data-error-for="tags" hidden></p>
    </div>

    <p class="field-error" id="dialog-general-error" role="alert" hidden></p>

    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="dialog-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" data-testid="save-task">Save task</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>

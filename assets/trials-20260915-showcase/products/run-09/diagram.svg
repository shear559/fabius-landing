<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 490" width="100%" height="auto"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="dtitle ddesc" font-family="Helvetica, Arial, sans-serif">
  <title id="dtitle">Feasible region and optimizer path for the parametric QP</title>
  <desc id="ddesc">
    Pentagon ABCDE is the feasible (x,y) region after eliminating z = 1-x-y.
    A=(0,0), B=(1/2,0), C=(3/5,1/10), D=(3/5,2/5), E=(0,1).
    The red path shows the optimal (x,y) as t runs from -2 to 4: it starts
    fixed at (0,1/4) for t in [-2,-1.5], slides to (3/8,0) for t in [-1.5,-1],
    slides along edge y=0 to vertex B for t in [-1,-0.5], stays fixed at B
    for t in [-0.5,0], slides along edge 2y+z=1/2 to vertex C for t in [0,1.8],
    then stays fixed at C for t in [1.8,4]. Vertex D is never optimal.
  </desc>

  <rect x="0" y="0" width="380" height="490" fill="#ffffff"/>

  <!-- axes -->
  <line x1="50" y1="333.8" x2="368" y2="333.8" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="368,333.8 360,330.3 360,337.3" fill="#94a3b8"/>
  <text x="371" y="337.8" font-size="12" fill="#475569">x</text>

  <line x1="94.2" y1="366" x2="94.2" y2="20" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="94.2,20 90.7,28 97.7,28" fill="#94a3b8"/>
  <text x="98" y="18" font-size="12" fill="#475569">y</text>

  <text x="86" y="345" font-size="11" fill="#475569" text-anchor="end">0</text>

  <!-- title -->
  <text x="190" y="14" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Feasible (x,y) region (z = 1-x-y) and optimizer path
  </text>

  <!-- feasible pentagon ABCDE -->
  <polygon points="94.2,333.8 282.6,333.8 320.3,306.0 320.3,222.8 94.2,56.2"
           fill="#dbeafe" stroke="#2563eb" stroke-width="2" fill-opacity="0.85"/>

  <!-- vertex dots -->
  <circle cx="94.2" cy="333.8" r="3.3" fill="#0f172a"/>
  <circle cx="282.6" cy="333.8" r="3.3" fill="#0f172a"/>
  <circle cx="320.3" cy="306.0" r="3.3" fill="#0f172a"/>
  <circle cx="320.3" cy="222.8" r="3.3" fill="#0f172a"/>
  <circle cx="94.2" cy="56.2" r="3.3" fill="#0f172a"/>

  <!-- vertex labels (single bold letter, close to each dot) -->
  <text x="87" y="348" font-size="12.5" font-weight="bold" text-anchor="end" fill="#0f172a">A</text>
  <text x="282.6" y="352.5" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">B</text>
  <text x="329" y="303" font-size="12.5" font-weight="bold" text-anchor="start" fill="#0f172a">C</text>
  <text x="329" y="226" font-size="12.5" font-weight="bold" text-anchor="start" fill="#0f172a">D</text>
  <text x="94.2" y="47" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">E</text>

  <!-- optimizer path -->
  <polyline points="94.2,264.4 235.5,333.8 282.6,333.8 320.3,306.0"
            fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"
            marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- path point coordinate labels -->
  <text x="86" y="268" font-size="10.5" text-anchor="end" fill="#991b1b">(0,1/4)</text>
  <text x="235.5" y="350" font-size="10.5" text-anchor="middle" fill="#991b1b">(3/8,0)</text>

  <!-- numbered regime markers on the path -->
  <g font-size="10.5" font-weight="bold" fill="#ffffff">
    <circle cx="94.2" cy="264.4" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
    <text x="94.2" y="268" text-anchor="middle">1</text>

    <circle cx="164.8" cy="299.1" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
    <text x="164.8" y="302.7" text-anchor="middle">2</text>

    <circle cx="259.1" cy="333.8" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
    <text x="259.1" y="337.4" text-anchor="middle">3</text>

    <circle cx="282.6" cy="333.8" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
    <text x="282.6" y="337.4" text-anchor="middle">4</text>

    <circle cx="301.5" cy="319.9" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
    <text x="301.5" y="323.5" text-anchor="middle">5</text>

    <circle cx="320.3" cy="306.0" r="9.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.3"/>
    <text x="320.3" y="309.6" text-anchor="middle">6</text>
  </g>

  <!-- legend -->
  <line x1="16" y1="368" x2="34" y2="368" stroke="#2563eb" stroke-width="6" stroke-opacity="0.55"/>
  <text x="38" y="371.5" font-size="10.5" fill="#334155">feasible region (pentagon ABCDE)</text>
  <line x1="16" y1="381" x2="34" y2="381" stroke="#dc2626" stroke-width="3"/>
  <text x="38" y="384.5" font-size="10.5" fill="#334155">optimizer (x,y) path as t runs -2 to 4</text>

  <text x="16" y="399" font-size="9.7" fill="#334155">A=(0,0)  B=(1/2,0)  C=(3/5,1/10)  D=(3/5,2/5)  E=(0,1)</text>
  <text x="16" y="412" font-size="9.2" fill="#64748b">edges: AB y=0 | BC 2y+z=1/2 | CD x=3/5 | DE x+y=1 | EA x=0</text>

  <g font-size="10.3" fill="#0f172a">
    <circle cx="19" cy="429" r="7" fill="#dc2626"/>
    <text x="19" y="432.3" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <text x="30" y="432.5">t in [-2,-1.5]: fixed (0,1/4,3/4)</text>

    <circle cx="19" cy="445" r="7" fill="#dc2626"/>
    <text x="19" y="448.3" font-size="9" fill="#fff" text-anchor="middle">2</text>
    <text x="30" y="448.5">t in [-1.5,-1]: interior, slides</text>

    <circle cx="19" cy="461" r="7" fill="#dc2626"/>
    <text x="19" y="464.3" font-size="9" fill="#fff" text-anchor="middle">3</text>
    <text x="30" y="464.5">t in [-1,-0.5]: slides on y=0</text>

    <circle cx="199" cy="429" r="7" fill="#dc2626"/>
    <text x="199" y="432.3" font-size="9" fill="#fff" text-anchor="middle">4</text>
    <text x="210" y="432.5">t in [-0.5,0]: fixed at B</text>

    <circle cx="199" cy="445" r="7" fill="#dc2626"/>
    <text x="199" y="448.3" font-size="9" fill="#fff" text-anchor="middle">5</text>
    <text x="210" y="448.5">t in [0,1.8]: slides on 2y+z=1/2</text>

    <circle cx="199" cy="461" r="7" fill="#dc2626"/>
    <text x="199" y="464.3" font-size="9" fill="#fff" text-anchor="middle">6</text>
    <text x="210" y="464.5">t in [1.8,4]: fixed at C</text>
  </g>

  <text x="190" y="481" font-size="9.3" fill="#64748b" text-anchor="middle">
    Vertex D is a feasible corner but is never optimal for any t in [-2,4]. Exact values: solution.md.
  </text>
</svg>

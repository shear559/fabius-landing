<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fabius — responsive design verification</title>
  <link rel="stylesheet" href="/design-preview.css">

<body>
  <header>
    <b>Fabius / design verification</b>

    <button type="button" id="check">Inspect layout</button>
    <output id="result" aria-live="polite">Loading public landing page…</output>
  </header>
  <main><iframe title="Responsive Fabius landing page" id="preview"></iframe></main>

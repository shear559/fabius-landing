name: Sync verified launch paper
on:
  push:
    branches: [codex/launch-paper-20261020]
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Copy the exact verified product paper
        run: |
          curl -fsSL https://raw.githubusercontent.com/shear559/fabius/00860f8dd170cfc2e4915a4ed0ffad524a070180/paper/fabius-as-a-system.pdf -o fabius-as-a-system.pdf
          echo 'f16cdf7023bc49d3df0c24f8c429c31de7860e89086c8c60ff792d0fa9a189ef  fabius-as-a-system.pdf' | sha256sum -c -
          git add fabius-as-a-system.pdf
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync verified launch paper'
          git push origin HEAD:codex/launch-paper-20261020
